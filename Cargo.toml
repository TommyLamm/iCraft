[package]
name = "icraft"
version = "0.1.0"
edition = "2021"
default-run = "icraft"

[features]
# Desktop-only storage/engine microbenchmarks (`src/microbench.rs` via
# `main.rs`). Opt-in: `cargo run --features microbench -- --microbench`.
# The old empty `harness` feature (sim_harness / final_acceptance) is gone.
microbench = []

[dependencies]
winit = "0.30"
wgpu = "0.19"
glam = "0.25"
noise = "0.8"
image = "0.24"
pollster = "0.3"
# Pinned so `image` / `rayon` keep the versions this workspace validated.
indexmap = "=2.2.6"
exr = "=1.71.0"
half = "=2.2.1"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
bytemuck = { version = "1.16", features = ["derive"] }
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
flate2 = "1.0"
# deflate-only: reuse workspace `flate2`; AES/bzip2/zstd stay off.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


